# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: quote-of-the-day-dotnet
metadata:
    template: quote-of-the-day-dotnet@0.0.1-beta
hooks:
    prepackage:
        shell: pwsh
        run: |
            Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
            ./infra/Setup-CreateDatabase.ps1
        interactive: true
        continueOnError: false
services:
    QuoteOfTheDay:
        # Keep this path in sync with the QUOTE_OF_THE_DAY_PROJECT azd environment setting.
        project: QuoteOfTheDay
        host: appservice
        language: dotnet